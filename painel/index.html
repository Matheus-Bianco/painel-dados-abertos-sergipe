<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Painel de Dados Abertos — Educação Sergipe | SEED">

  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

</head>

<body>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="https://drive.google.com/thumbnail?id=1zin49zFHOsTwJNsW3rCXd6nQh1bSrvq8&sz=w200" alt="Logo SEED Sergipe" class="sidebar-logo" onerror="this.style.display='none'">
      <div class="sidebar-title">
        <span class="sidebar-title-main">Dados Abertos</span>
        <span class="sidebar-title-sub">Educação — Sergipe</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">NAVEGAÇÃO</div>
      <nav class="sidebar-nav">
        <button class="sidebar-tab active" data-view="home" id="tab-home"><img class="nav-icon" src="img/icons/nav_home.png" alt="" onerror="this.style.display='none'"> Início</button>
        <button class="sidebar-tab" data-view="ideb" id="tab-ideb"><img class="nav-icon" src="img/icons/nav_ideb.png" alt="" onerror="this.style.display='none'"> IDEB</button>
        <!-- Demais indicadores: próximos releases
        <button class="sidebar-tab" data-view="acesso" style="display:none">Acesso</button>
        -->
      </nav>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-badge">SEED — Sergipe</div>
      <div class="sidebar-footer-text">Gestão para Aprendizagem · FGV DGPE</div>
    </div>
  </aside>

  <main class="main" id="main-wrapper">
    <div class="main-scroll" id="main-content">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Carregando dados do IDEB...</span>
      </div>
    </div>
  </main>

  <script src="js/ideb_se_rankings.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
